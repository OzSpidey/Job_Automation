name: _probe why job 4458219879 was missed (throwaway)

# Is "AI Associate" @ Alumni Ventures reachable via our existing keywords at
# depth, or does it need a new keyword? Two very different fixes.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Hunt for the job id
        run: |
          python - <<'PY'
          import re, time, requests
          from bs4 import BeautifulSoup

          TARGET = "4458219879"
          URL = "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search"
          H = {
              "User-Agent": ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"),
              "Accept-Language": "en-US,en;q=0.9",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Referer": "https://www.linkedin.com/jobs/search/",
          }

          def ids_at(kw, start, **extra):
              p = {"keywords": kw, "geoId": "103644278", "f_TPR": "r86400",
                   "start": start, **extra}
              try:
                  r = requests.get(URL, headers=H, params=p, timeout=25)
              except Exception as e:
                  print(f"      EXC {e}")
                  return None
              if r.status_code != 200:
                  print(f"      status={r.status_code}")
                  return None
              soup = BeautifulSoup(r.text, "html.parser")
              out = []
              for c in soup.find_all("div", class_=re.compile(r"base-search-card")):
                  m = re.search(r"jobPosting:(\d+)", c.get("data-entity-urn", "") or "")
                  if m and m.group(1) not in out:
                      out.append(m.group(1))
              return out

          def hunt(kw, max_start, label, **extra):
              print(f"\n>>> {label}")
              total = set()
              for start in range(0, max_start + 1, 10):
                  got = ids_at(kw, start, **extra)
                  if got is None:
                      break
                  total.update(got)
                  if TARGET in got:
                      print(f"    *** FOUND at start={start} "
                            f"(cumulative distinct={len(total)}) ***")
                      return start
                  time.sleep(2)
              print(f"    not found in start 0..{max_start} "
                    f"({len(total)} distinct jobs scanned)")
              return None

          print("=" * 78)
          print(f"Hunting job {TARGET} — 'AI Associate' @ Alumni Ventures")
          print("=" * 78)

          # 1. our current keyword, far past the depth we actually sweep
          hunt("AI Engineer", 500, "keyword='AI Engineer' (ours), f_JT=F, depth 500",
               f_JT="F")

          # 2. same but without the full-time filter, in case f_JT excludes it
          hunt("AI Engineer", 200, "keyword='AI Engineer', NO f_JT filter, depth 200")

          # 3. the literal title
          hunt("AI Associate", 200, "keyword='AI Associate' (literal title), f_JT=F",
               f_JT="F")

          # 4. a broader term
          hunt("AI", 200, "keyword='AI' (broad), f_JT=F", f_JT="F")

          print("\n[done]")
          PY

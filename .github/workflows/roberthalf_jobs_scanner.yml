name: Robert Half Jobs Scanner

on:
  # No native GitHub cron on purpose (removed 2026-08-27). Timing is owned by the
  # external cron site, which dispatches this workflow over the API — see the
  # other externally-triggered scrapers for the webhook setup. The previous
  # native schedule was '0 15,18 * * 1-5' + '0 1 * * 2-6' (11am/2pm/9pm ET), and
  # it routinely started 50min-2h late in GitHub's shared queue, which is part of
  # why timing moved out.
  #
  # Robert Half Auto-Apply is chained to this workflow via `workflow_run`, and
  # that fires on ANY completion, dispatch included — so the applier still runs
  # right after every cron-site trigger. Nothing to schedule on that side.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          repository: OzSpidey/Job_Automation_Private
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install httpx python-dotenv

      - name: Run scraper
        env:
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          # Alerts off — roberthalf_autoapply.py emails the applied list instead.
          # This scanner still MUST run: it is the applier's only queue source.
          RH_SCANNER_EMAIL:   '0'
        run: python roberthalf_jobs_scanner.py

      - name: Persist state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/roberthalf_seen_jobs.json csv/new_jobs.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update robert half seen jobs [skip ci]"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done

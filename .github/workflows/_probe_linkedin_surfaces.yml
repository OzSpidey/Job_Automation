name: _probe LinkedIn guest surfaces (throwaway)

# Disposable diagnostic. Round 2: the /jobs/* HTML surface is a hard 999 from
# Actions, so probe what the WORKING /jobs-guest/ endpoint can actually give us.
#   1. how deep does `start` paginate before it dries up?
#   2. does sortBy=DD (newest-first) work there? today the scraper is relevance-sorted
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Probe fragment endpoint depth + sorting
        run: |
          python - <<'PY'
          import re, time, requests
          from bs4 import BeautifulSoup

          URL = "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search"
          H = {
              "User-Agent": ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"),
              "Accept-Language": "en-US,en;q=0.9",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Referer": "https://www.linkedin.com/jobs/search/",
          }
          BASE = {"keywords": "AI Engineer", "geoId": "103644278", "f_JT": "F"}

          def fetch(params):
              try:
                  r = requests.get(URL, headers=H, params=params, timeout=25)
              except Exception as e:
                  print(f"    EXC {e}")
                  return None, []
              if r.status_code != 200:
                  print(f"    status={r.status_code} len={len(r.text)}")
                  return r, []
              soup = BeautifulSoup(r.text, "html.parser")
              out = []
              for c in soup.find_all("div", class_=re.compile(r"base-search-card")):
                  urn = c.get("data-entity-urn", "")
                  m = re.search(r"jobPosting:(\d+)", urn)
                  jid = m.group(1) if m else None
                  if not jid:
                      a = c.find("a", href=re.compile(r"/jobs/view/"))
                      m2 = re.search(r"/jobs/view/(?:[^/?]*-)?(\d+)", a.get("href","")) if a else None
                      jid = m2.group(1) if m2 else None
                  t = c.find("time")
                  out.append((jid, (t.get_text(strip=True) if t else ""),
                              (t.get("datetime") if t else "")))
              return r, out

          print("=" * 96)
          print("1. DEPTH — how far does `start` go?  (f_TPR=r86400, no sortBy)")
          print("=" * 96)
          seen_all, last_ids = set(), None
          for start in [0, 50, 100, 200, 300, 500, 700, 1000]:
              r, jobs = fetch({**BASE, "f_TPR": "r86400", "start": start})
              ids = [j[0] for j in jobs]
              dupe = "SAME-AS-PREV" if ids and ids == last_ids else ""
              new = len([i for i in ids if i not in seen_all])
              seen_all.update(i for i in ids if i)
              print(f"  start={start:<5} status={r.status_code if r else '---':<4} "
                    f"got={len(ids):<3} new={new:<3} cumulative={len(seen_all):<4} {dupe}")
              last_ids = ids
              if not ids:
                  print("    -> dried up, stopping")
                  break
              time.sleep(4)

          print()
          print("=" * 96)
          print("2. SORTING — does sortBy=DD work on the guest fragment endpoint?")
          print("=" * 96)
          for label, extra in [("relevance (current behaviour)", {}),
                               ("sortBy=DD (newest first)", {"sortBy": "DD"})]:
              r, jobs = fetch({**BASE, "f_TPR": "r86400", "start": 0, **extra})
              print(f"  {label}  -> {len(jobs)} cards")
              for jid, txt, dt in jobs[:10]:
                  print(f"       {jid}  {txt:<18} {dt}")
              print()
              time.sleep(4)

          print("=" * 96)
          print("3. Does sortBy=DD change WHICH jobs come back deeper in?")
          print("=" * 96)
          for start in [0, 100, 300]:
              r, jobs = fetch({**BASE, "f_TPR": "r86400", "sortBy": "DD", "start": start})
              print(f"  sortBy=DD start={start:<5} got={len(jobs):<3} "
                    f"first={jobs[0][1] if jobs else '-':<16} last={jobs[-1][1] if jobs else '-'}")
              time.sleep(4)
          print()
          print("[done]")
          PY

name: _probe LinkedIn guest surfaces (throwaway)

# Disposable diagnostic: which LinkedIn guest surfaces serve job cards to a
# GitHub Actions (Azure datacenter) IP? Delete after use.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install deps
        run: pip install requests

      - name: Probe surfaces
        run: |
          python - <<'PY'
          import re, time, random, requests

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36")

          BARE = {
              "User-Agent": UA,
              "Accept-Language": "en-US,en;q=0.9",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Referer": "https://www.linkedin.com/jobs/",
          }

          # full Chrome-ish header set
          RICH = dict(BARE)
          RICH.update({
              "Accept-Encoding": "gzip, deflate, br",
              "sec-ch-ua": '"Chromium";v="124", "Google Chrome";v="124", "Not-A.Brand";v="99"',
              "sec-ch-ua-mobile": "?0",
              "sec-ch-ua-platform": '"Windows"',
              "Sec-Fetch-Dest": "document",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "same-origin",
              "Sec-Fetch-User": "?1",
              "Upgrade-Insecure-Requests": "1",
              "Cache-Control": "max-age=0",
              "Connection": "keep-alive",
          })

          Q = {"keywords": "AI Engineer", "geoId": "103644278",
               "f_TPR": "r86400", "f_JT": "F", "sortBy": "DD"}

          def report(name, resp):
              if resp is None:
                  print(f"  {name:<44} REQUEST FAILED")
                  return
              body = resp.text
              views = len(re.findall(r"/jobs/view/", body))
              cards = len(re.findall(r"base-search-card", body))
              wall  = bool(re.search(r"authwall|sign in to|join now|/login", body, re.I))
              verdict = "CARDS" if views > 0 else ("WALL" if wall else "EMPTY")
              print(f"  {name:<44} {resp.status_code} len={len(body):>7} "
                    f"views={views:>3} cards={cards:>3} wall={str(wall):<5} -> {verdict}")
              if views:
                  print(f"       final_url={resp.url[:110]}")

          def try_get(name, url, headers, params=None, sess=None):
              g = sess.get if sess else requests.get
              try:
                  r = g(url, headers=headers, params=params, timeout=25)
              except Exception as e:
                  print(f"  {name:<44} EXC {e}")
                  return None
              report(name, r)
              return r

          print("=" * 100)
          print("A. CONTROL — fragment endpoint that already works")
          print("=" * 100)
          try_get("seeMoreJobPostings (bare)",
                  "https://www.linkedin.com/jobs-guest/jobs/api/seeMoreJobPostings/search",
                  BARE, {**Q, "start": 0})
          time.sleep(4)

          print()
          print("=" * 100)
          print("B. /jobs/search/ — header + cookie-session variants")
          print("=" * 100)
          try_get("/jobs/search/ bare stateless (what failed)",
                  "https://www.linkedin.com/jobs/search/", BARE, Q)
          time.sleep(4)

          try_get("/jobs/search/ rich headers, stateless",
                  "https://www.linkedin.com/jobs/search/", RICH, Q)
          time.sleep(4)

          # warm a session on a public page first so we hold guest cookies
          s = requests.Session()
          warm = try_get("  [warmup] GET /jobs/", "https://www.linkedin.com/jobs/", RICH, None, s)
          print(f"       cookies now: {sorted(s.cookies.keys())}")
          time.sleep(4)
          try_get("/jobs/search/ warmed session + rich",
                  "https://www.linkedin.com/jobs/search/", RICH, Q, s)
          time.sleep(4)

          try_get("/jobs/search (no trailing slash)",
                  "https://www.linkedin.com/jobs/search", RICH, Q, s)
          time.sleep(4)

          print()
          print("=" * 100)
          print("C. SEO landing pages — built to be crawled")
          print("=" * 100)
          for path in [
              "https://www.linkedin.com/jobs/ai-engineer-jobs",
              "https://www.linkedin.com/jobs/ai-engineer-jobs-united-states",
              "https://www.linkedin.com/jobs/data-engineer-jobs",
              "https://www.linkedin.com/jobs/ai-engineer-jobs-in-united-states",
          ]:
              try_get(path.replace("https://www.linkedin.com", ""), path, RICH, None, s)
              time.sleep(4)

          print()
          print("=" * 100)
          print("D. SEO landing page + query filters")
          print("=" * 100)
          try_get("/jobs/ai-engineer-jobs?f_TPR=r86400",
                  "https://www.linkedin.com/jobs/ai-engineer-jobs",
                  RICH, {"f_TPR": "r86400", "sortBy": "DD", "position": 1, "pageNum": 0}, s)
          print()
          print("[done]")
          PY

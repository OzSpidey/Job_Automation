name: Robert Half Auto-Apply

# No schedule yet — recon must confirm the apply flow before this is armed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'recon = read-only dump | walk = click Apply once, never submit | apply = submit | email-test = re-send summary only'
        type: choice
        default: recon
        options: [recon, walk, apply, email-test]
      walk_logged_in:
        description: 'Allow walk to run WITH the saved session (a logged-in Apply click may submit instantly)'
        type: boolean
        default: false
      apply_limit:
        description: 'Max Apply CLICKS this run (runaway guard; RH has no application limit)'
        type: string
        default: '10'

permissions:
  contents: write

jobs:
  autoapply:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: OzSpidey/Job_Automation_Private
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main            # always read the latest queue, not the trigger SHA

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v2-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install chromium

      - name: Install Playwright system deps
        run: playwright install-deps chromium

      # Robert Half is Adobe/Akamai-fronted; headless Chrome gets bot-walled.
      # Same headful-under-Xvfb recipe that made Naukri work.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

# No resume step: the Robert Half profile already has the resume attached and
# the logged-in Quick apply path pulls it from there, so nothing is uploaded.

      - name: Run Robert Half Auto-Apply
        env:
          RH_MODE:              ${{ inputs.mode }}
          RH_ENABLE_SUBMIT:     ${{ vars.RH_ENABLE_SUBMIT }}
          RH_SESSION_B64:       ${{ secrets.RH_SESSION_B64 }}
          RH_WALK_LOGGED_IN:    ${{ inputs.walk_logged_in && '1' || '' }}
          APPLY_LIMIT:          ${{ inputs.apply_limit }}
          HEADLESS:             'false'
          DISPLAY:              ':99'
          APPLICANT_INFO_JSON:  ${{ secrets.APPLICANT_INFO_JSON }}
          EMAIL_SENDER:         ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:             ${{ secrets.EMAIL_TO }}
        run: |
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 3
          python roberthalf_autoapply.py --mode "${RH_MODE}"

      - name: Upload recon screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roberthalf-${{ inputs.mode }}-shots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist applied state
        if: inputs.mode == 'apply'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Staged SEPARATELY on purpose: `git add a b` stages NOTHING if either
          # path is missing, and csv/roberthalf_applied.csv only exists once
          # something has actually been applied. That silently lost a whole run
          # of state, which would have caused re-applications.
          git add json/roberthalf_applied.json || true
          git add csv/roberthalf_applied.csv   || true
          git diff --staged --quiet || git commit -m "chore: update robert half applied jobs [skip ci]"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
          done

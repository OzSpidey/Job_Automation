name: LinkedIn Deep Sweep (second net)

# Triggered from the external cron site via the workflow_dispatch API, same as
# the other scrapers here. No GitHub `schedule:` block on purpose — GitHub's own
# cron runs 1.5-3 hrs late on free runners, the external trigger fires on time.
#
# Every input has a production-ready default, so the cron site can POST a bare
# {"ref":"main"} with no inputs payload at all.
#
# Sweeps the guest endpoint deeper than linkedin_nologin_scraper.py (which stops
# at start=90). Measured: at equal keyword+window, depth 90 finds 0 new and
# depth 200 finds 48 (run 32757494692 vs 32757622773). Keyword breadth matters
# even more than depth — LinkedIn matching is title-literal, so a broad "AI"
# term catches roles "AI Engineer" never ranks at any depth.
on:
  workflow_dispatch:
    inputs:
      time_window:
        description: 'f_TPR window (r7200=2h, r10800=3h, r86400=24h). Keep wider than the cron interval.'
        required: false
        default: 'r10800'
      max_start:
        # 140, not 150: the script walks range(0, MAX_START+1, PAGE_STEP), so
        # 140 yields exactly 15 pages (start 0,10..140) while 150 yields 16.
        description: 'Sweep depth. 140=15 req/role. ~500 is where LinkedIn dries up.'
        required: false
        default: '140'
      roles:
        # 2026-09-02: Business Intelligence, Business Analyst and Analytics
        # Engineer added; depth cut 200 -> 140 to pay for them.
        #   was      3 roles x 21p =  63 req/run
        #   +BI,BA   5 roles x 21p = 105
        #   now      6 roles x 15p =  90
        #
        # All three additions are LOW-VOLUME keywords, and geoId is only a soft
        # filter — past the last geo-matched result LinkedIn pads the remaining
        # pages with worldwide roles. So expect the back half of the sweep on
        # these three to return foreign postings. us_verdict() in the script
        # drops them, so nothing junk reaches the inbox, but the requests are
        # still spent. Watch the "SKIP non-US" volume and the per-role
        # "cards seen -> new kept" summary before adding more narrow keywords.
        #
        # Analytics Engineer also runs in the catch-up at 3p. That overlap is
        # fine: all three workflows share the seen file, so first run to reach
        # a job wins and the other skips it.
        description: 'Pipe-separated roles, independent of the main scraper.'
        required: false
        default: 'AI Engineer|Data Analyst|AI|Business Intelligence|Business Analyst|Analytics Engineer'
    # No cross_check or persist_state inputs any more. All three LinkedIn
    # workflows share one state file, so dedup is unconditional and state is
    # always written — a "don't record" option is exactly how duplicates got
    # sent in the first place.

permissions:
  contents: write

# Stops a sweep overlapping ITSELF if the cron fires again mid-run (a sweep
# takes 5-10 min). Deliberately NOT shared with the other two LinkedIn
# workflows: contention on the shared state file is handled by the union merge
# in the persist step, and putting the 5-min run in this group would park it
# behind a 10-minute sweep and delay every alert.
# cancel-in-progress stays false — a killed run has already sent its email but
# not yet recorded it, which is the one state we must never create.
concurrency:
  group: linkedin-deepsweep
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: OzSpidey/Job_Automation_Private
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dotenv

      - name: Run LinkedIn deep sweep
        env:
          EMAIL_SENDER:          ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD:    ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:              ${{ secrets.EMAIL_TO }}
          TIME_WINDOW:           ${{ inputs.time_window }}
          MAX_START:             ${{ inputs.max_start }}
          DEEPSWEEP_ROLES:       ${{ inputs.roles }}
          SCRAPER_LABEL:         Deep Sweep
        run: python linkedin_deepsweep_scraper.py

      # All three LinkedIn workflows share ONE state file, so simultaneous
      # writes are normal, not an error (the main run fires every 5 min while a
      # deep sweep takes 5-10). `git pull --rebase` would conflict on the JSON,
      # fail every retry, and drop this run's ids — which re-alerts the roles we
      # just emailed. So: union-merge onto a fresh origin/main, and if we lose
      # the push race, re-merge against the new remote and try again.
      #
      # Every git call is explicitly guarded. These blocks run under `bash -e`,
      # where an unguarded failure aborts the step instead of retrying, turning
      # ordinary contention into lost state.
      - name: Persist shared seen state
        if: always()
        run: |
          SEEN=json/linkedin_nologin_seen.json
          if [ ! -f "$SEEN" ]; then
            echo "No seen file this run (scraper may have failed early) — nothing to persist."
            exit 0
          fi
          cp "$SEEN" /tmp/ours.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            if ! git fetch -q origin main; then
              echo "fetch failed (attempt $i), retrying..."; sleep $((i * 3)); continue
            fi
            # -f is required: the scraper just rewrote the seen file, so the
            # tree is dirty and a plain checkout refuses. Safe to discard,
            # our copy is already at /tmp/ours.json.
            if ! git checkout -q -f -B main origin/main; then
              echo "checkout failed (attempt $i), retrying..."; sleep $((i * 3)); continue
            fi
            # merge_seen refuses to write if the committed copy is corrupt, so a
            # non-zero exit here is real data risk, not contention. Stop.
            if ! python merge_seen.py "$SEEN" /tmp/ours.json; then
              echo "::error::merge refused; shared state NOT written"
              exit 1
            fi
            git add "$SEEN"
            if git diff --staged --quiet; then
              echo "No new job ids to record."
              exit 0
            fi
            git commit -q -m "chore: update linkedin shared seen jobs [skip ci]"
            if git push -q origin main; then
              echo "Recorded. (merge counts printed above)"
              exit 0
            fi
            echo "Lost push race on attempt $i, re-merging against new remote..."
            sleep $((i * 2))
          done
          echo "::warning::Could not persist after 6 attempts; some roles may be re-alerted next run."

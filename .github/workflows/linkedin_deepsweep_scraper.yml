name: LinkedIn Deep Sweep (second net)

# Triggered from the external cron site via the workflow_dispatch API, same as
# the other scrapers here. No GitHub `schedule:` block on purpose — GitHub's own
# cron runs 1.5-3 hrs late on free runners, the external trigger fires on time.
#
# Every input has a production-ready default, so the cron site can POST a bare
# {"ref":"main"} with no inputs payload at all.
#
# Sweeps the guest endpoint deeper than linkedin_nologin_scraper.py (which stops
# at start=90). Measured: at equal keyword+window, depth 90 finds 0 new and
# depth 200 finds 48 (run 32757494692 vs 32757622773). Keyword breadth matters
# even more than depth — LinkedIn matching is title-literal, so a broad "AI"
# term catches roles "AI Engineer" never ranks at any depth.
on:
  workflow_dispatch:
    inputs:
      time_window:
        description: 'f_TPR window (r7200=2h, r10800=3h, r86400=24h). Keep wider than the cron interval.'
        required: false
        default: 'r10800'
      max_start:
        description: 'Sweep depth. 200=21 req/role. ~500 is where LinkedIn dries up.'
        required: false
        default: '200'
      roles:
        description: 'Pipe-separated roles, independent of the main scraper.'
        required: false
        default: 'AI Engineer|Data Analyst|AI'
      cross_check:
        description: 'Suppress roles the main scraper already alerted (1=yes, 0=no)'
        required: false
        default: '1'
      persist_state:
        description: 'Commit the seen-jobs file back. MUST be true on a schedule or every run re-emails the same roles.'
        required: false
        default: 'true'

permissions:
  contents: write

# A sweep takes 5-10 min. If the cron fires again before the previous run
# finished, two jobs would race on json/linkedin_deepsweep_seen.json and one
# push would clobber the other. Queue instead of overlapping; never cancel
# mid-run, since a killed run still sent its email but never recorded it.
concurrency:
  group: linkedin-deepsweep
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: OzSpidey/Job_Automation_Private
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 python-dotenv

      - name: Run LinkedIn deep sweep
        env:
          EMAIL_SENDER:          ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD:    ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:              ${{ secrets.EMAIL_TO }}
          TIME_WINDOW:           ${{ inputs.time_window }}
          MAX_START:             ${{ inputs.max_start }}
          DEEPSWEEP_ROLES:       ${{ inputs.roles }}
          CROSS_CHECK_MAIN_SEEN: ${{ inputs.cross_check }}
          SCRAPER_LABEL:         Deep Sweep
        run: python linkedin_deepsweep_scraper.py

      # always() so a partial sweep still records what it emailed. Without it a
      # timeout would send mail and then forget, re-alerting the same roles.
      - name: Persist seen jobs state
        if: always() && inputs.persist_state == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/linkedin_deepsweep_seen.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update linkedin deep sweep seen jobs [skip ci]"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
          done

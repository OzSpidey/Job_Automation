name: Dice Jobs Scanner

on:
  # NO native cron — triggered from the external cron website, like Randstad.
  # Dice Auto-Apply chains off this workflow's completion (workflow_run).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          repository: OzSpidey/Job_Automation_Private
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install httpx python-dotenv

      - name: Run scraper
        env:
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          # Alert email off: the applier's summary is the email that matters,
          # and Dice volume would send dozens of rows a day. Set '1' to restore.
          DICE_SCANNER_EMAIL: '0'
        run: python dice_jobs_scanner.py

      - name: Persist state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Staged separately: `git add a b` stages nothing if either is missing.
          git add json/dice_seen_jobs.json || true
          git add csv/new_jobs.csv         || true
          git diff --staged --quiet || git commit -m "chore: update dice seen jobs [skip ci]"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done

name: Dice Auto-Apply

on:
  # CHAINED to the scanner, same reasoning as randstad_autoapply.yml: a fixed
  # cron offset is a guess against GitHub's runner queue, workflow_run is not.
  workflow_run:
    workflows: ["Dice Jobs Scanner"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'recon = read-only dump | walk = one wizard step | dry = whole wizard, stop before submit | apply = submit | email-test = re-send summary only'
        type: choice
        default: recon
        options: [recon, walk, dry, apply, email-test]
      apply_limit:
        description: 'Max wizard entries this run (runaway guard)'
        type: string
        default: '40'
      apply_roles:
        description: 'Roles to apply to, comma-separated, or "all". Blank = all six scanned roles'
        type: string
        default: ''
      recon_ids:
        description: 'recon only: Dice job ids (or 8-char prefixes) to inspect instead of the queue'
        type: string
        default: ''
      queue_age_days:
        description: 'Only apply to roles found in the last N days. Blank = 1'
        type: string
        default: ''

permissions:
  contents: write

# Never two appliers at once: overlapping runs read the same queue and would
# submit the same jobs twice. A second run waits instead of being cancelled.
concurrency:
  group: dice-autoapply
  cancel-in-progress: false

jobs:
  autoapply:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Up to 100 page visits / 40 submits; applied state is only saved at the end,
    # so a timeout mid-run would lose it and the next run could re-apply.
    timeout-minutes: 100

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: OzSpidey/Job_Automation_Private
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main            # always read the latest queue, not the trigger SHA

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v2-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install chromium

      - name: Install Playwright system deps
        run: playwright install-deps chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Four resumes routed by role (2026-09-29; BA/BI swapped to *_Dice.pdf 2026-10-05): DE for Data Engineer, BA for
      # Business Analyst, AI for AI Engineer, BI for everything else. Unlike
      # Randstad these get DISTINCT names, because Dice's resume picker lists
      # saved resumes by filename and the script finds the role's one by name.
      # job-assets keeps the source filenames (traceable to the local file).
      - name: Fetch resumes
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/OzSpidey/job-assets.git \
            /tmp/job-assets
          mkdir -p /tmp/dice_resumes
          cp /tmp/job-assets/Osborne_DE_Dice.pdf /tmp/dice_resumes/Osborne_Lopes_DE.pdf
          cp /tmp/job-assets/Osborne_BI_Dice.pdf /tmp/dice_resumes/Osborne_Lopes_BI.pdf
          cp /tmp/job-assets/Osborne_BA_Dice.pdf /tmp/dice_resumes/Osborne_Lopes_BA.pdf
          cp /tmp/job-assets/Osborne_AI_Dice.pdf          /tmp/dice_resumes/Osborne_Lopes_AI.pdf
          for f in /tmp/dice_resumes/*.pdf; do
            test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
          done
          ls -la /tmp/dice_resumes

      - name: Run Dice Auto-Apply
        env:
          # Chained runs supply NO inputs, hence every fallback.
          DICE_MODE:               ${{ inputs.mode || 'apply' }}
          DICE_ENABLE_SUBMIT:      ${{ vars.DICE_ENABLE_SUBMIT }}
          DICE_SESSION_B64:        ${{ secrets.DICE_SESSION_B64 }}
          APPLY_LIMIT:             ${{ inputs.apply_limit || '40' }}
          # Job pages opened per run. Already-applied/dead pages use visits without
          # applying, so 40 visits only yielded ~20 applications.
          DICE_MAX_VISITS:         '100'
          DICE_APPLY_ROLES:        ${{ inputs.apply_roles }}
          DICE_QUEUE_MAX_AGE_DAYS: ${{ inputs.queue_age_days }}
          DICE_RECON_IDS:          ${{ inputs.recon_ids }}
          RESUME_PATH_DE:          /tmp/dice_resumes/Osborne_Lopes_DE.pdf
          RESUME_PATH_BI:          /tmp/dice_resumes/Osborne_Lopes_BI.pdf
          RESUME_PATH_BA:          /tmp/dice_resumes/Osborne_Lopes_BA.pdf
          RESUME_PATH_AI:          /tmp/dice_resumes/Osborne_Lopes_AI.pdf
          HEADLESS:                'false'
          DISPLAY:                 ':99'
          EMAIL_SENDER:            ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:                ${{ secrets.EMAIL_TO }}
        run: |
          # Chained runs default to apply mode; until a session exists that
          # would just abort, so skip quietly instead of failing every scan.
          if [ -z "${DICE_SESSION_B64}" ] && [ "${DICE_MODE}" != "recon" ] && [ "${DICE_MODE}" != "email-test" ]; then
            echo "::warning::DICE_SESSION_B64 not set — skipping ${DICE_MODE}. Run capture_dice_session.py."
            exit 0
          fi
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 3
          python dice_autoapply.py --mode "${DICE_MODE}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dice-${{ inputs.mode || 'apply' }}-shots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist applied state
        if: always() && (inputs.mode || 'apply') == 'apply'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/dice_applied.json || true
          git add csv/dice_applied.csv   || true
          git diff --staged --quiet || git commit -m "chore: update dice applied jobs [skip ci]"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
          done

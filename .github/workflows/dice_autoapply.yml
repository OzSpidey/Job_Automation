name: Dice Auto-Apply

on:
  # CHAINED to the scanner, same reasoning as randstad_autoapply.yml: a fixed
  # cron offset is a guess against GitHub's runner queue, workflow_run is not.
  workflow_run:
    workflows: ["Dice Jobs Scanner"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'recon = read-only dump | walk = one wizard step | dry = whole wizard, stop before submit | apply = submit | email-test = re-send summary only'
        type: choice
        default: recon
        options: [recon, walk, dry, apply, email-test]
      apply_limit:
        description: 'Max wizard entries this run (runaway guard)'
        type: string
        default: '10'
      apply_roles:
        description: 'Roles to apply to, comma-separated, or "all". Blank = all six scanned roles'
        type: string
        default: ''
      queue_age_days:
        description: 'Only apply to roles found in the last N days. Blank = 3'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  autoapply:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: OzSpidey/Job_Automation_Private
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: main            # always read the latest queue, not the trigger SHA

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v2-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install chromium

      - name: Install Playwright system deps
        run: playwright install-deps chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Same three resumes and routing as Randstad: BA for Business Analyst,
      # AI for AI Engineer, BI for everything else. The script swaps it into
      # the Dice wizard only when the resume step exposes an upload.
      - name: Fetch resumes
        run: |
          git clone --depth 1 \
            https://x-access-token:${{ secrets.PRIVATE_REPO_PAT }}@github.com/OzSpidey/job-assets.git \
            /tmp/job-assets
          mkdir -p /tmp/resume_ba /tmp/resume_bi /tmp/resume_ai
          cp /tmp/job-assets/Osborne_BA_JhexSN_Senior.pdf /tmp/resume_ba/resume.pdf
          cp /tmp/job-assets/Osborne_BI_JhexSN_Senior.pdf /tmp/resume_bi/resume.pdf
          cp /tmp/job-assets/Osborne_AI_JhexSN.pdf        /tmp/resume_ai/resume.pdf
          for f in /tmp/resume_ba/resume.pdf /tmp/resume_bi/resume.pdf /tmp/resume_ai/resume.pdf; do
            test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
          done

      - name: Run Dice Auto-Apply
        env:
          # Chained runs supply NO inputs, hence every fallback.
          DICE_MODE:               ${{ inputs.mode || 'apply' }}
          DICE_ENABLE_SUBMIT:      ${{ vars.DICE_ENABLE_SUBMIT }}
          DICE_SESSION_B64:        ${{ secrets.DICE_SESSION_B64 }}
          APPLY_LIMIT:             ${{ inputs.apply_limit || '10' }}
          DICE_APPLY_ROLES:        ${{ inputs.apply_roles }}
          DICE_QUEUE_MAX_AGE_DAYS: ${{ inputs.queue_age_days }}
          RESUME_PATH_BA:          /tmp/resume_ba/resume.pdf
          RESUME_PATH_BI:          /tmp/resume_bi/resume.pdf
          RESUME_PATH_AI:          /tmp/resume_ai/resume.pdf
          HEADLESS:                'false'
          DISPLAY:                 ':99'
          EMAIL_SENDER:            ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:                ${{ secrets.EMAIL_TO }}
        run: |
          # Chained runs default to apply mode; until a session exists that
          # would just abort, so skip quietly instead of failing every scan.
          if [ -z "${DICE_SESSION_B64}" ] && [ "${DICE_MODE}" != "recon" ] && [ "${DICE_MODE}" != "email-test" ]; then
            echo "::warning::DICE_SESSION_B64 not set — skipping ${DICE_MODE}. Run capture_dice_session.py."
            exit 0
          fi
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 3
          python dice_autoapply.py --mode "${DICE_MODE}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dice-${{ inputs.mode || 'apply' }}-shots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist applied state
        if: always() && (inputs.mode || 'apply') == 'apply'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/dice_applied.json || true
          git add csv/dice_applied.csv   || true
          git diff --staged --quiet || git commit -m "chore: update dice applied jobs [skip ci]"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in $((i * 3))s..."
            sleep $((i * 3))
          done

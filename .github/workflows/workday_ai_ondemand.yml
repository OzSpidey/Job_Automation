name: Workday AI Roles (On-Demand)

# One-off catch-up run of the Workday scraper's `aie` (AI Engineer) profile over a
# wider lookback than the scheduled all-roles run. Emails the results and uploads
# the CSV as an artifact. Commits nothing — no seen-jobs or company-list state is
# written back, so this cannot disturb the scheduled scrapers.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Look back this many days (Workday 'Posted X Days Ago')"
        type: string
        default: "14"

permissions:
  contents: read

jobs:
  scrape-ai:
    name: AI roles (batch ${{ matrix.batch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OzSpidey/Job_Automation_Private
          token: ${{ secrets.PRIVATE_REPO_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests python-dotenv
      - name: Run scraper (AI profile)
        env:
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          WD_MAX_AGE_DAYS:    ${{ inputs.days }}
        run: python workday_scraper.py --role aie --batch ${{ matrix.batch }}
      - name: Upload AI roles CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workday-ai-roles-batch-${{ matrix.batch }}
          path: csv/workday_jobs_aie_${{ matrix.batch }}.csv
          if-no-files-found: warn

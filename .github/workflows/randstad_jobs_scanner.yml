name: Randstad Jobs Scanner

on:
  # NO native cron. Triggered externally instead (cron website -> GitHub
  # workflow_dispatch webhook), set up 2026-08-28, which is why the schedule
  # block is gone rather than commented out — two timers would double-scan.
  # The old expression was '45 13,18,23 * * 1-5' = 9:45am/2:45pm/7:45pm ET.
  #
  # Randstad Auto-Apply still chains off this workflow's completion, and that
  # works the same for an externally dispatched run as for a scheduled one —
  # verified 2026-08-28 (scanner run 33131412913 -> applier run 33131426058).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          repository: OzSpidey/Job_Automation_Private
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install httpx python-dotenv

      - name: Run scraper
        env:
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
        run: python randstad_jobs_scanner.py

      - name: Persist state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/randstad_seen_jobs.json csv/new_jobs.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update randstad seen jobs [skip ci]"
          git checkout -- . 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done
